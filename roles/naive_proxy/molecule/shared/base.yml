---
# Role-scoped molecule base config for the naive_proxy role.
#
# Loaded explicitly by `molecule/Makefile` (which injects `-c
# molecule/shared/base.yml` for every scenario).
# Each scenario's `molecule.yml` deep-merges on top of this — anything
# common across scenarios lives here, anything scenario-specific stays
# in the scenario file.
#
# Important caveats about molecule's deep-merge:
#   * Dicts are deep-merged; values from the scenario override base.
#   * **Lists are REPLACED entirely** (see molecule.util.merge_dicts).
#     That is why `driver` (a dict, can be in base) is shared from
#     here, but `platforms` (a list) MUST stay in each scenario.
#   * Legacy `provisioner.{config_options, playbooks, env,
#     ansible_args}` get migrated to `ansible.{cfg, playbooks, env,
#     executor.args.ansible_playbook}` after merge — and the migration
#     REPLACES the destination wholesale. We therefore use the new
#     `ansible.*` syntax everywhere so deep-merge happens in one place
#     and the migration short-circuits with no destructive replace.

dependency:
  name: galaxy

verifier:
  name: ansible

provisioner:
  name: ansible
  options:
    D: true
  inventory:
    # Default host_vars for the molecule-managed instance. Each
    # scenario overrides what it needs in its own molecule.yml — deep
    # merge keeps the rest. `mp_driver` is the single source of truth
    # for driver-conditional behaviour (e.g. `when: mp_driver !=
    # 'podman'` in shared prepare); MUST live in inventory
    # (precedence 9), not in any `vars_files` (priority 14), or
    # vars_files would silently mask scenario-specific values and
    # break e.g. the gha scenario's `native`.
    host_vars:
      molecule-naive-proxy:
        mp_driver: podman
    # ---- sing-box build pins (singbox-stress + anytls-stress only) ----------
    # Consumed by `molecule/shared/Dockerfile.j2` (symlinked into both stress
    # scenarios), which compiles sing-box from source and bakes the static
    # binary + libcronet.so into the molecule instance image. `group_vars.all`
    # is the ONE inventory location molecule injects into BOTH the create play
    # (renders Dockerfile.j2 against `localhost`) and the converge/verify
    # plays — host_vars would not reach the localhost create play. Centralised
    # here (shared base config) so the two stress scenarios never drift; the
    # default / debian-bookworm / gha scenarios inherit these too but ignore
    # them (their own Dockerfile.j2 does not reference them).
    #
    # Pins mirror the RELEASED Android client. SFA (sing-box-for-android)
    # ships `libbox.aar`, which sing-box's own CI builds with gomobile from the
    # same sing-box tag. This harness rebuilds that libbox recipe (version,
    # Go, tags, linker flags, cronet) as a Linux CLI, so the stress client runs
    # the exact Naive/AnyTLS/TUN code real SFA users run. After bumping any
    # tuple member, follow `doc/maintenance/update-versions.md`: destroy every
    # instance holding the shared local trixie tag and remove only that exact
    # image before the Makefile converges the stress scenarios.
    #
    # WHERE TO LOOK to refresh these (DO NOT remove these URLs; `make
    # versions` cross-checks every item):
    #   1. Released SFA — `main` branch `version.properties`: VERSION_NAME is
    #      the sing-box tag (add `v`), GO_VERSION the toolchain (strip `go`).
    #      The sing-box GitHub release of that tag MUST carry
    #      `SFA-<VERSION_NAME>-universal.apk` (the released APK). Never use
    #      SFA `dev` or a prerelease.
    #        https://github.com/SagerNet/sing-box-for-android/blob/main/version.properties
    #        https://github.com/SagerNet/sing-box/releases
    #   2. Android CI at that tag — job `build_android_library` runs
    #      `go run ./cmd/internal/build_libbox -target android`; its
    #      `setup-go` go-version MUST equal GO_VERSION:
    #        https://github.com/SagerNet/sing-box/blob/<tag>/.github/workflows/build.yml
    #   3. Android build tags — `sharedTags` in build_libbox (the main
    #      `libbox.aar` variant, Android API 24; `libbox-legacy.aar` omits
    #      `with_naive_outbound`). NOT release/DEFAULT_BUILD_TAGS: those are
    #      the CLI release tags (with_acme, with_dhcp, with_ccm, with_ocm and
    #      with_cloudflared are CLI-only; the ts_omit_* set is libbox-only):
    #        https://github.com/SagerNet/sing-box/blob/<tag>/cmd/internal/build_libbox/main.go
    #      `with_purego` is OUR only addition: cronet-go then dlopens
    #      libcronet.so at runtime, so the Linux binary builds with
    #      CGO_ENABLED=0 (Android links the static libcronet.a through CGO).
    #   4. Linker flags — build_shared.LinkerFlags, shared by libbox and the
    #      CLI release (published verbatim as release/LDFLAGS). The
    #      Dockerfile adds the version `-X` plus `-s -w -buildid=` exactly as
    #      LinkerFlags does for a non-debug build:
    #        https://github.com/SagerNet/sing-box/blob/<tag>/cmd/internal/build_shared/flags.go
    #        https://github.com/SagerNet/sing-box/blob/<tag>/release/LDFLAGS
    #   5. cronet — the exact cronet-go commit sing-box builds against is
    #      `.github/CRONET_GO_VERSION` (its short SHA is the go.mod
    #      `github.com/sagernet/cronet-go v0.0.0-<date>-<sha>` pin). The
    #      ABI-matched Linux library is `lib/linux_<arch>/libcronet.so` AT THAT
    #      COMMIT — the same file sing-box's purego Linux release extracts.
    #      Do NOT substitute a cronet-go GitHub release asset: releases are cut
    #      from other commits, and a C-ABI mismatch segfaults at runtime.
    #        https://github.com/SagerNet/sing-box/blob/<tag>/.github/CRONET_GO_VERSION
    #        https://github.com/sagernet/cronet-go/tree/<commit>/lib
    #
    # LAST CHECKED 2026-10-02: SFA main advertises 1.14.2 / go1.26.8; the
    # v1.14.2 release ships SFA-1.14.2-universal.apk and its Android CI uses
    # Go 1.26.8. CRONET_GO_VERSION is 0d28acc44093 (Chromium 150.0.7871.63,
    # libraries built from cronet-go tag v150.0.7871.63-3, which has no GitHub
    # release — the latest release, v150.0.7871.63-2, is an older commit).
    group_vars:
      all:
        # SFA version.properties → VERSION_NAME (with `v`).
        singbox_build_version: "v1.14.2"
        # build_libbox `sharedTags` (Android libbox.aar) + our `with_purego`.
        singbox_build_tags:
          - with_gvisor
          - with_quic
          - with_wireguard
          - with_utls
          - with_naive_outbound
          - with_clash_api
          - with_usbip
          - with_openvpn
          - with_openconnect
          - badlinkname
          - tfogo_checklinkname0
          - with_tailscale
          - ts_omit_logtail
          - ts_omit_ssh
          - ts_omit_drive
          - ts_omit_taildrop
          - ts_omit_webclient
          - ts_omit_doctor
          - ts_omit_capture
          - ts_omit_kube
          - ts_omit_aws
          - ts_omit_synology
          - ts_omit_bird
          - with_purego
        # release/LDFLAGS (= build_shared.LinkerFlags without version/strip).
        singbox_build_ldflags: "-X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0"
        # SFA version.properties → GO_VERSION (strip the `go` prefix).
        singbox_build_go_version: "1.26.8"
        # sing-box .github/CRONET_GO_VERSION at that tag (full commit SHA).
        singbox_cronet_commit: "0d28acc44093df24b2526dea3d6ffefd6b0a54f0"

ansible:
  cfg:
    defaults:
      callbacks_enabled: ansible.posix.profile_tasks
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
    verify: ../shared/verify.yml
