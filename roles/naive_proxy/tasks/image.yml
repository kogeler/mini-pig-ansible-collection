- name: naive-proxy | image | render Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: "{{ _naive_proxy_build_dir }}/Containerfile"
    owner: root
    group: root
    mode: "0644"
  register: _naive_proxy_containerfile

- name: naive-proxy | image | build naive backend image
  containers.podman.podman_image:
    name: "{{ _naive_proxy_backend_image }}"
    tag: "{{ _naive_proxy_backend_image_tag }}"
    path: "{{ _naive_proxy_build_dir }}"
    build:
      # The Molecule harness runs Buildah inside rootless Podman. Its image
      # provides crun explicitly; forcing Buildah's chroot isolation bypasses
      # that runtime and fails while remounting /dev. The default OCI
      # isolation works both there and on regular production hosts.
      extra_args: "--network=host"
    state: build
    force: "{{ _naive_proxy_containerfile.changed }}"
  notify: naive-proxy | handlers | restart naive-backend
