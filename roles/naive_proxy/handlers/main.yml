- name: naive-proxy | handlers | stop containers before restarting naive-pod
  listen: naive-proxy | handlers | restart naive-pod
  ansible.builtin.systemd:
    name: "{{ item }}"
    daemon_reload: true
    state: stopped
  loop: >-
    {{
      [_naive_proxy_backend_unit]
      + ([_naive_proxy_anytls_unit] if naive_proxy_anytls_enabled else [])
      + [_naive_proxy_haproxy_unit, _naive_proxy_decoy_unit]
      + ([_naive_proxy_pebble_unit] if naive_proxy_molecule_mode else [])
    }}
  ignore_errors: "{{ ansible_check_mode }}"

- name: naive-proxy | handlers | wait for pod container cgroups to be released
  listen: naive-proxy | handlers | restart naive-pod
  ansible.builtin.command:
    argv:
      - find
      - "/sys/fs/cgroup/system.slice/{{ item }}"
      - -name
      - cgroup.procs
      - -type
      - f
      - -exec
      - cat
      - "{}"
      - +
  loop: >-
    {{
      [_naive_proxy_backend_unit]
      + ([_naive_proxy_anytls_unit] if naive_proxy_anytls_enabled else [])
      + [_naive_proxy_haproxy_unit, _naive_proxy_decoy_unit]
      + ([_naive_proxy_pebble_unit] if naive_proxy_molecule_mode else [])
    }}
  register: _naive_proxy_pod_child_cgroup_procs
  changed_when: false
  failed_when: false
  retries: 30
  delay: 1
  until: >-
    _naive_proxy_pod_child_cgroup_procs.rc != 0
    or (_naive_proxy_pod_child_cgroup_procs.stdout | trim | length == 0)
  when: not ansible_check_mode

- name: naive-proxy | handlers | restart naive-pod
  ansible.builtin.systemd:
    name: "{{ _naive_proxy_pod_unit }}"
    enabled: true
    daemon_reload: true
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"
  notify:
    - naive-proxy | handlers | restart naive-pebble
    - naive-proxy | handlers | restart naive-decoy
    - naive-proxy | handlers | restart naive-haproxy
    - naive-proxy | handlers | restart naive-backend
    - naive-proxy | handlers | restart naive-anytls

