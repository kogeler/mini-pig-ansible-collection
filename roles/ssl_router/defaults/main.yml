ssl_router_base_dir: "/opt/ssl-router"
ssl_router_image_name: "docker.io/library/nginx"
ssl_router_image_version: "stable-alpine"
ssl_router_https_port: 443
ssl_router_upstream_map: {}
#  k8s:
#    regex: ".*abc.com"
#    host: abc.abc
#    port: "5443"

ssl_router_preread_buffer_size: "32k"
ssl_router_proxy_buffer_size: "64k"

# local TCP port of an ACME TLS-ALPN-01 solver; when set, connections
# with ALPN "acme-tls/1" are routed to it instead of the SNI map
ssl_router_acme_alpn_port: ""
