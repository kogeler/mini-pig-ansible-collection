---
driver:
  name: podman

platforms:
  - name: molecule-ssl-router
    image: "docker.io/library/debian:trixie"
    pre_build_image: false
    systemd: always
    network: "${MP_NETWORK:-slirp4netns}"
    security_opts:
      - "label=disable"
      - "unmask=/proc/*"
      - "apparmor=unconfined"
    capabilities:
      - SYS_ADMIN
      - SETUID
      - SETGID
      - NET_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    command: ""
    override_command: false
