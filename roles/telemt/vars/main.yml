_telemt_container_name: telemt
_telemt_systemd_unit_name: "podman-{{ _telemt_container_name }}.service"
_telemt_pod_name: telemt-pod
_telemt_pod_systemd_unit_name: "podman-{{ _telemt_pod_name }}.service"

_telemt_decoy_container_name: telemt-decoy
_telemt_decoy_systemd_unit_name: "podman-{{ _telemt_decoy_container_name }}.service"
_telemt_decoy_domain: "{{ telemt_decoy_domain if telemt_decoy_domain else telemt_domain }}"
_telemt_decoy_data_dir: "{{ telemt_config_dir }}/caddy-data"
_telemt_decoy_config_dir: "{{ telemt_config_dir }}/caddy-config"
_telemt_decoy_html_dir: "{{ telemt_config_dir }}/decoy-html"
_telemt_direct_decoy_port: 8443
_telemt_web_decoy_port: 18081
_telemt_decoy_port: >-
  {{ _telemt_web_decoy_port
     if telemt_deployment_mode == 'web'
     else _telemt_direct_decoy_port }}

# -- WEB ingress ---------------------------------------------------------------
_telemt_web_listener_port: 18080
_telemt_haproxy_container_name: telemt-haproxy
_telemt_haproxy_systemd_unit_name: "podman-{{ _telemt_haproxy_container_name }}.service"
_telemt_haproxy_https_port: 8444
_telemt_haproxy_stats_port: 19999
_telemt_haproxy_config_path: "{{ telemt_config_dir }}/haproxy.cfg"
_telemt_certs_dir: "{{ telemt_config_dir }}/certs"
_telemt_acme_data_dir: "{{ telemt_config_dir }}/acme-data"
_telemt_acme_alpn_port: 10443
_telemt_acme_renew_unit_name: telemt-acme-renew.service
_telemt_acme_renew_timer_name: telemt-acme-renew.timer
_telemt_mode_marker_path: "{{ telemt_config_dir }}/deployment-mode"
_telemt_web_trusted_proxy_cidrs:
  - 127.0.0.1/32
_telemt_web_limit_keys:
  - max_header_bytes
  - max_body_bytes
  - max_frame_payload_bytes
  - carrier_batch_bytes
  - max_frames_per_body
  - max_http_connections
  - max_http_handlers
  - max_body_readers
  - max_body_bytes_global
  - max_sessions_global
  - max_sessions_per_ip
  - max_streams_per_session
  - max_streams_global
  - max_stream_handshakes
  - max_tombstones_per_session
  - pending_bytes_per_session
  - pending_bytes_global
  - pending_items_per_session
  - pending_items_global
  - control_bytes_per_session
  - control_bytes_global
  - max_bootstraps_global
  - max_bootstraps_per_ip
  - max_vhosts
  - max_profiles
  - max_static_files
  - max_static_file_bytes
  - max_static_bytes
  - memory_envelope_bytes
  - new_bootstraps_per_minute
  - new_bootstraps_burst
  - new_sessions_per_minute
  - new_sessions_burst
  - new_streams_per_minute
  - new_streams_burst
_telemt_web_timeout_keys:
  - header_secs
  - body_secs
  - stream_handshake_secs
  - long_poll_secs
  - bootstrap_lifetime_secs
  - reconnect_grace_secs
  - http_idle_secs
  - shutdown_secs
  - decoy_header_secs
_telemt_web_long_poll_secs: >-
  {{ telemt_web_timeouts.long_poll_secs | default(25) | int }}
_telemt_haproxy_http_timeout_secs: >-
  {{ (_telemt_web_long_poll_secs | int)
     + (telemt_web_haproxy_timeout_margin_secs | int) }}

# -- Pebble (molecule mode only) ----------------------------------------------
_telemt_pebble_name: telemt-pebble
_telemt_pebble_systemd_unit_name: "podman-{{ _telemt_pebble_name }}.service"
_telemt_pebble_image: ghcr.io/letsencrypt/pebble
_telemt_pebble_image_tag: "2.10.1"
_telemt_pebble_port: 14000
_telemt_pebble_mgmt_port: 15000
# Caddy in the same pod-netns hits localhost — Pebble's leaf cert is for
# `localhost`, so anything else (telemt.test, 127.0.0.1) would fail SNI.
_telemt_pebble_acme_server: "https://localhost:{{ _telemt_pebble_port }}/dir"
_telemt_pebble_root_cert_path: "{{ telemt_config_dir }}/pebble-root.pem"
