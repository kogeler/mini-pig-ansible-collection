- name: "telemt | handlers | stop containers before pod restart | {{ telemt_instance_name }}"
  ansible.builtin.systemd:
    name: "{{ item }}"
    daemon_reload: true
    state: stopped
  loop: >-
    {{
      ([_telemt_haproxy_systemd_unit_name] if telemt_deployment_mode == 'web' else [])
      + [_telemt_systemd_unit_name, _telemt_decoy_systemd_unit_name]
      + ([_telemt_pebble_systemd_unit_name] if telemt_molecule_mode else [])
    }}
  ignore_errors: "{{ ansible_check_mode }}"

- name: "telemt | handlers | wait for pod child cgroups | {{ telemt_instance_name }}"
  ansible.builtin.command:
    argv:
      - find
      - "/sys/fs/cgroup/system.slice/{{ item }}"
      - -name
      - cgroup.procs
      - -type
      - f
      - -exec
      - cat
      - "{}"
      - +
  loop: >-
    {{
      ([_telemt_haproxy_systemd_unit_name] if telemt_deployment_mode == 'web' else [])
      + [_telemt_systemd_unit_name, _telemt_decoy_systemd_unit_name]
      + ([_telemt_pebble_systemd_unit_name] if telemt_molecule_mode else [])
    }}
  register: _telemt_pod_child_cgroup_procs
  changed_when: false
  failed_when: false
  retries: 30
  delay: 1
  until: >-
    _telemt_pod_child_cgroup_procs.rc != 0
    or (_telemt_pod_child_cgroup_procs.stdout | trim | length == 0)
  when: not ansible_check_mode

- name: "telemt | handlers | restart pod | {{ telemt_instance_name }}"
  ansible.builtin.systemd:
    name: "{{ _telemt_pod_systemd_unit_name }}"
    enabled: true
    daemon_reload: true
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"
  notify: >-
    {{
      _telemt_restart_pebble_handler
      + _telemt_restart_decoy_handler
      + _telemt_restart_telemt_handler
      + _telemt_restart_haproxy_handler
    }}

- name: "telemt | handlers | stop Pebble | {{ telemt_instance_name }}"
  ansible.builtin.systemd:
    name: "{{ _telemt_pebble_systemd_unit_name }}"
    daemon_reload: true
    state: stopped
  when: telemt_molecule_mode
  ignore_errors: "{{ ansible_check_mode }}"

- name: "telemt | handlers | wait for Pebble cgroup | {{ telemt_instance_name }}"
  ansible.builtin.command:
    argv:
      - find
      - "/sys/fs/cgroup/system.slice/{{ _telemt_pebble_systemd_unit_name }}"
      - -name
      - cgroup.procs
      - -type
      - f
      - -exec
      - cat
      - "{}"
      - +
  register: _telemt_pebble_cgroup_procs
  changed_when: false
  failed_when: false
  retries: 30
  delay: 1
  until: >-
    _telemt_pebble_cgroup_procs.rc != 0
    or (_telemt_pebble_cgroup_procs.stdout | trim | length == 0)
  when:
    - telemt_molecule_mode
    - not ansible_check_mode

- name: "telemt | handlers | start Pebble | {{ telemt_instance_name }}"
  ansible.builtin.systemd:
    name: "{{ _telemt_pebble_systemd_unit_name }}"
    enabled: true
    daemon_reload: true
    state: started
  when: telemt_molecule_mode
  ignore_errors: "{{ ansible_check_mode }}"

