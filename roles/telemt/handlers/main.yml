- name: telemt | handlers | stop containers before pod restart
  listen: restart telemt-pod
  ansible.builtin.systemd:
    name: "{{ item }}"
    daemon_reload: true
    state: stopped
  loop: >-
    {{
      ([_telemt_haproxy_systemd_unit_name] if telemt_deployment_mode == 'web' else [])
      + [_telemt_systemd_unit_name, _telemt_decoy_systemd_unit_name]
      + ([_telemt_pebble_systemd_unit_name] if telemt_molecule_mode else [])
    }}
  ignore_errors: "{{ ansible_check_mode }}"

- name: telemt | handlers | wait for pod child cgroups
  listen: restart telemt-pod
  ansible.builtin.command:
    argv:
      - find
      - "/sys/fs/cgroup/system.slice/{{ item }}"
      - -name
      - cgroup.procs
      - -type
      - f
      - -exec
      - cat
      - "{}"
      - +
  loop: >-
    {{
      ([_telemt_haproxy_systemd_unit_name] if telemt_deployment_mode == 'web' else [])
      + [_telemt_systemd_unit_name, _telemt_decoy_systemd_unit_name]
      + ([_telemt_pebble_systemd_unit_name] if telemt_molecule_mode else [])
    }}
  register: _telemt_pod_child_cgroup_procs
  changed_when: false
  failed_when: false
  retries: 30
  delay: 1
  until: >-
    _telemt_pod_child_cgroup_procs.rc != 0
    or (_telemt_pod_child_cgroup_procs.stdout | trim | length == 0)
  when: not ansible_check_mode

- name: telemt | handlers | restart pod
  listen: restart telemt-pod
  ansible.builtin.systemd:
    name: "{{ _telemt_pod_systemd_unit_name }}"
    enabled: true
    daemon_reload: true
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"
  notify:
    - restart telemt-pebble
    - restart telemt-decoy
    - restart telemt
    - restart telemt-haproxy

- name: telemt | handlers | stop Pebble
  listen: restart telemt-pebble
