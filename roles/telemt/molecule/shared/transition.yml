---
- name: Verify WEB to direct to WEB transition
  hosts: all
  gather_facts: false
  vars_files:
    - vars/common.yml
  tasks:
    - name: Switch live instance to direct mode
      ansible.builtin.include_role:
        name: kogeler.mini_pig.telemt
      vars:
        telemt_deployment_mode: direct
        telemt_domain: "{{ molecule_telemt_domain }}"
        telemt_listen_port: "{{ molecule_telemt_listen_port }}"
        telemt_users: "{{ molecule_telemt_users }}"
        telemt_link_endpoints: "{{ molecule_telemt_link_endpoints }}"
        telemt_molecule_mode: true

    - name: Inspect inactive WEB ingress after direct transition
      ansible.builtin.systemd:
        name: podman-telemt-haproxy.service
      register: _transition_haproxy_direct

    - name: Check direct listener after transition
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ molecule_telemt_listen_port }}"
        timeout: 60

    - name: Read direct mode marker
      ansible.builtin.slurp:
        src: /opt/telemt/deployment-mode
      register: _transition_direct_marker

    - name: Assert WEB ingress stopped in direct mode
      ansible.builtin.assert:
        that:
          - _transition_haproxy_direct.status.ActiveState == 'inactive'
          - (_transition_direct_marker.content | b64decode | trim) == 'direct'

    - name: Switch live instance back to WEB mode
      ansible.builtin.include_role:
        name: kogeler.mini_pig.telemt
      vars:
        telemt_deployment_mode: web
        telemt_domain: "{{ molecule_telemt_domain }}"
        telemt_listen_port: 443
        telemt_web_public_ip: "127.0.0.1"
        telemt_users: "{{ molecule_telemt_users }}"
        telemt_web_carrier: "{{ molecule_telemt_web_carrier | default('https') }}"
        telemt_web_profiles:
          - user: alice
            secret_mode: plain
          - user: bob
            secret_mode: dd
        telemt_web_timeouts:
          long_poll_secs: 1
        telemt_web_haproxy_timeout_margin_secs: 3
        telemt_decoy_index_html: index.html
        telemt_molecule_mode: true
        telemt_api_enabled: true
        telemt_publish_api: true
        telemt_api_bind: "127.0.0.1"
        telemt_api_port: "{{ molecule_telemt_api_port }}"
        telemt_publish_metrics: true
        telemt_metrics_bind: "127.0.0.1"
        telemt_metrics_port: "{{ molecule_telemt_metrics_port }}"

    - name: Check WEB listener after rollback
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 443
        timeout: 60

    - name: Inspect restored WEB ingress
      ansible.builtin.systemd:
        name: podman-telemt-haproxy.service
      register: _transition_haproxy_web

    - name: Read restored WEB mode marker
      ansible.builtin.slurp:
        src: /opt/telemt/deployment-mode
      register: _transition_web_marker

    - name: Assert WEB ingress restored
      ansible.builtin.assert:
        that:
          - _transition_haproxy_web.status.ActiveState == 'active'
          - (_transition_web_marker.content | b64decode | trim) == 'web'
