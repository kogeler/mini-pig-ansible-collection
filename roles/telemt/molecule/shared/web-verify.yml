---
- name: Verify Telemt WEB
  hosts: all
  gather_facts: false
  vars_files:
    - vars/common.yml
  vars:
    _web_carrier: "{{ molecule_telemt_web_carrier }}"
    _web_config_dir: /opt/telemt_web
    _web_instance_name: telemt-web
    # Same label ordering the role applies, so config-order assertions can
    # compare against a known sequence.
    _web_domains: >-
      {{
        molecule_telemt_web_domains
        | dict2items(key_name='label', value_name='domain')
        | sort(attribute='label')
      }}
    # The domain the upgrade test rewinds to the pre-multi-domain layout.
    _web_legacy_domain: "{{ molecule_telemt_web_domains.main }}"
    _web_legacy_cert_files:
      - fullchain.pem
      - key.pem
      - cert.pem
    _web_legacy_acme_conf: >-
      {{ _web_config_dir }}/acme-data/{{ _web_legacy_domain }}_ecc/{{ _web_legacy_domain }}.conf
  tasks:
    - name: Wait for common runtime services
      ansible.builtin.import_tasks: tasks/wait-services.yml
      vars:
        molecule_telemt_listen_port: 443
        molecule_telemt_instance_name: "{{ _web_instance_name }}"

    - name: Wait for HAProxy service
      ansible.builtin.systemd:
        name: "podman-{{ _web_instance_name }}-haproxy.service"
      register: _haproxy_service
      until: _haproxy_service.status.ActiveState == 'active'
      retries: 20
      delay: 3

    - name: Read deployment mode marker
      ansible.builtin.slurp:
        src: "{{ _web_config_dir }}/deployment-mode"
      register: _mode_marker

    - name: Read rendered WEB configs
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ _web_config_dir }}/telemt.toml"
        - "{{ _web_config_dir }}/haproxy.cfg"
        - "{{ _web_config_dir }}/Caddyfile"
      register: _web_configs

    - name: Assert WEB topology is rendered safely
      vars:
        _web_telemt_toml: "{{ _web_configs.results[0].content | b64decode }}"
        _web_haproxy_cfg: "{{ _web_configs.results[1].content | b64decode }}"
        _web_caddyfile: "{{ _web_configs.results[2].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - (_mode_marker.content | b64decode | trim) == 'web'
          - "'transport = \"web\"' in _web_telemt_toml"
          - "'ip = \"127.0.0.1\"' in _web_telemt_toml"
          - "'proxy_protocol = false' in _web_telemt_toml"
          - "'public_addr = \"127.0.0.1:443\"' in _web_telemt_toml"
          - "'carrier = \"' ~ _web_carrier ~ '\"' in _web_telemt_toml"
          - "'send-proxy-v2' in _web_haproxy_cfg"
          - "'accept-proxy ssl alpn h2,http/1.1' in _web_haproxy_cfg"
          - "'server telemt 127.0.0.1:18080' in _web_haproxy_cfg"
          - "'auto_https off' in _web_caddyfile"

    - name: Assert every WEB domain owns a vhost, a certificate, and a route
      vars:
        _web_telemt_toml: "{{ _web_configs.results[0].content | b64decode }}"
        _web_haproxy_cfg: "{{ _web_configs.results[1].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'host = \"' ~ item.domain ~ '\"' in _web_telemt_toml"
          - >-
            'ssl-f-use crt /certs/' ~ item.domain ~ '/fullchain.pem key /certs/'
            ~ item.domain ~ '/key.pem' in _web_haproxy_cfg
          - >-
            'acl telemt_host hdr(host) -i ' ~ item.domain ~ ' ' ~ item.domain
            ~ ':443' in _web_haproxy_cfg
          - >-
            'http-request set-header Host ' ~ item.domain ~ ' if { hdr(host) -i '
            ~ item.domain ~ ' ' ~ item.domain ~ ':443 }' in _web_haproxy_cfg
      loop: "{{ _web_domains }}"
      loop_control:
        label: "{{ item.label }}"

    - name: Assert WEB vhost set matches the domain map exactly
      vars:
        _web_telemt_toml: "{{ _web_configs.results[0].content | b64decode }}"
        _web_haproxy_cfg: "{{ _web_configs.results[1].content | b64decode }}"
      ansible.builtin.assert:
        that:
          # No stray vhost beyond the declared map, and no shared certificate.
          - _web_telemt_toml.count('[[web.vhosts]]') == _web_domains | length
          - _web_haproxy_cfg.count('ssl-f-use crt ') == _web_domains | length
          # `alt` sorts before `main`, so a label-ordered render puts web2
          # first even though the operator map lists web.telemt.test first.
          - >-
            _web_haproxy_cfg.find('/certs/web2.telemt.test/')
            < _web_haproxy_cfg.find('/certs/web.telemt.test/')

    - name: Stat per-domain WEB certificate material
      ansible.builtin.stat:
        path: "{{ _web_config_dir }}/certs/{{ item.0.domain }}/{{ item.1 }}"
      loop: "{{ _web_domains | product(['fullchain.pem', 'key.pem']) | list }}"
      loop_control:
        label: "{{ item.0.domain }}/{{ item.1 }}"
      register: _web_cert_files

    - name: Stat pre-multi-domain flat certificate path
      ansible.builtin.stat:
        path: "{{ _web_config_dir }}/certs/fullchain.pem"
      register: _web_legacy_cert_file

    - name: Assert certificates are stored one directory per domain
      ansible.builtin.assert:
        that:
          - _web_cert_files.results | map(attribute='stat.exists') | unique | list == [true]
          - not _web_legacy_cert_file.stat.exists

    - name: Accept forwarded WEB ingress with an independent declared relay IP
      ansible.builtin.include_role:
        name: kogeler.mini_pig.telemt
        tasks_from: preflight.yml
      vars:
        telemt_deployment_mode: web
        telemt_web_domains: "{{ molecule_telemt_web_domains }}"
        telemt_listen_port: 8443
        telemt_web_public_ip: "10.20.30.40"
        telemt_users: "{{ molecule_telemt_users }}"
        telemt_decoy_index_html: index.html

    - name: Verify fail-fast WEB preflight cases
      ansible.builtin.include_tasks: tasks/expect-web-preflight-failure.yml
      loop:
        - name: direct-domain-in-web-mode
          domain: web.telemt.test
          error: telemt_domain is a direct-mode setting
        - name: invalid-public-ip
          public_ip: 999.0.0.1
          error: telemt_web_public_ip must be a concrete IPv4 address
        - name: unspecified-public-ip
          public_ip: 0.0.0.0
          error: telemt_web_public_ip must be a concrete IPv4 address
        - name: unsupported-public-ip-list
          public_ip:
            - 127.0.0.1
            - 127.0.0.2
          error: telemt_web_public_ip must be one string
        - name: unsupported-carrier
          carrier: websocket
          error: telemt_web_carrier must be either
        - name: unsupported-default-secret-mode
          default_secret_mode: ee
          error: telemt_web_default_secret_mode must be either
        - name: unsupported-ee-profile
          profiles:
            - user: alice
              secret_mode: ee
          error: secret_mode must be 'plain' or 'dd'
        - name: ambiguous-decoy-source
          site_dir: /tmp/duplicate-decoy
          error: WEB mode requires exactly one operator-owned decoy source
        - name: domain-map-not-a-mapping
          web_domains:
            - web.telemt.test
          error: telemt_web_domains must be a non-empty mapping
        - name: empty-domain-map
          web_domains: {}
          error: telemt_web_domains must be a non-empty mapping
        - name: invalid-domain-map-label
          web_domains:
            Primary Site: web.telemt.test
          error: telemt_web_domains label
        - name: invalid-domain-map-value
          web_domains:
            primary: Web.telemt.test
          error: must be a canonical lowercase FQDN
        - name: duplicate-domain-map-value
          web_domains:
            primary: web.telemt.test
            backup: web.telemt.test
          error: must not map two labels to the same domain
        - name: domain-map-over-vhost-limit
          web_domains:
            primary: web.telemt.test
            backup: web2.telemt.test
          limits:
            max_vhosts: 1
          error: telemt_web_limits.max_vhosts allows
      loop_control:
        loop_var: _web_preflight_case
        label: "{{ _web_preflight_case.name }}"

    - name: Assert rejected preflight cases did not alter WEB runtime
      ansible.builtin.assert:
        that:
          - (_mode_marker.content | b64decode | trim) == 'web'
          - _haproxy_service.status.ActiveState == 'active'

    - name: Wait for a Pebble-issued certificate on every WEB domain
      community.crypto.get_certificate:
        host: 127.0.0.1
        port: 443
        server_name: "{{ item.domain }}"
      register: _web_certificates
      until:
        - _web_certificates.cert is defined
        - "'Pebble' in (_web_certificates.issuer.CN | default(''))"
      retries: 30
      delay: 3
      loop: "{{ _web_domains }}"
      loop_control:
        label: "{{ item.domain }}"

    - name: Inspect the certificate served for each WEB domain
      community.crypto.x509_certificate_info:
        content: "{{ item.cert }}"
      register: _web_certificate_info
      loop: "{{ _web_certificates.results }}"
      loop_control:
        label: "{{ item.item.domain }}"

    - name: Assert SNI selects a separate single-SAN certificate per domain
      ansible.builtin.assert:
        that:
          - item.0.subject_alt_name == ['DNS:' ~ item.1.domain]
        fail_msg: >-
          The certificate served for {{ item.1.domain }} covers
          {{ item.0.subject_alt_name }}. Each WEB domain must hold its own
          certificate so probing one domain cannot enumerate the others.
      loop: "{{ _web_certificate_info.results | zip(_web_domains) | list }}"
      loop_control:
        label: "{{ item.1.domain }}"

    - name: Negotiate HTTP/2 ALPN on every WEB domain
      ansible.builtin.command:
        argv:
          - openssl
          - s_client
          - -connect
          - 127.0.0.1:443
          - -servername
          - "{{ item.domain }}"
          - -alpn
          - h2
      register: _web_alpn
      changed_when: false
      failed_when: >-
        _web_alpn.rc != 0
        or 'ALPN protocol: h2' not in (_web_alpn.stdout ~ _web_alpn.stderr)
      loop: "{{ _web_domains }}"
      loop_control:
        label: "{{ item.domain }}"

    - name: Gather virtualization facts for carrier redeployments
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - virtual

    # The loop ends on the scenario default so a verify run does not leave
    # runtime state that would make a later idempotence run report changes.
    - name: Verify every supported WEB carrier over HTTP/2
      ansible.builtin.include_tasks: tasks/verify-web-carrier.yml
      loop:
        - https-lanes
        - https
      loop_control:
        loop_var: _web_carrier_under_test
        label: "{{ _web_carrier_under_test }}"

    - name: Read emitted WEB links
      ansible.builtin.slurp:
        src: "{{ _web_config_dir }}/molecule-web-link-debug.json"
      register: _web_links_raw

    - name: Assert one WEB link per user per domain
      vars:
        _web_links: "{{ _web_links_raw.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - _web_links | length == (molecule_telemt_users | length) * (_web_domains | length)
          - "'[alice@main] tg://webproxy?server=web.telemt.test&secret=' ~ molecule_telemt_users.alice in _web_links"
          - "'[alice@alt] tg://webproxy?server=web2.telemt.test&secret=' ~ molecule_telemt_users.alice in _web_links"
          - "'[bob@main] tg://webproxy?server=web.telemt.test&secret=dd' ~ molecule_telemt_users.bob in _web_links"
          - "'[bob@alt] tg://webproxy?server=web2.telemt.test&secret=dd' ~ molecule_telemt_users.bob in _web_links"
          - "(_web_links | join(' ')).find('&port=') == -1"
          - "(_web_links | join(' ')).find('&secret=ee') == -1"

    - name: Verify colocated direct and WEB deployments
      ansible.builtin.import_tasks: tasks/verify-coexistence.yml

    # A deployment predating telemt_web_domains is reconstructed here and then
    # upgraded in place. acme.sh still holds a current certificate recorded
    # against the flat paths, so a plain `--issue` answers "Skipping. Next
    # renewal time is ..." and writes nothing; unless the role deletes that
    # rudiment outright, HAProxy keeps serving the self-signed bootstrap until
    # the renewal window opens weeks later. Runs last because it mutates the
    # deployment.
    - name: Reconstruct the pre-multi-domain certificate layout
      ansible.builtin.copy:
        src: "{{ _web_config_dir }}/certs/{{ _web_legacy_domain }}/{{ item }}"
        dest: "{{ _web_config_dir }}/certs/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop: "{{ _web_legacy_cert_files }}"

    - name: Point acme.sh state back at the pre-multi-domain paths
      ansible.builtin.replace:
        path: "{{ _web_legacy_acme_conf }}"
        regexp: "'/certs/{{ _web_legacy_domain | regex_escape }}/"
        replace: "'/certs/"

    - name: Drop the per-domain directory the old layout never had
      ansible.builtin.file:
        path: "{{ _web_config_dir }}/certs/{{ _web_legacy_domain }}"
        state: absent

    - name: Upgrade the reconstructed deployment
      ansible.builtin.include_tasks: tasks/converge-web.yml

    - name: Apply handlers after the upgrade
      ansible.builtin.meta: flush_handlers

    - name: Stat pre-multi-domain rudiments after the upgrade
      ansible.builtin.stat:
        path: "{{ _web_config_dir }}/certs/{{ item }}"
      loop: "{{ _web_legacy_cert_files }}"
      register: _web_legacy_rudiments

    - name: Read the rebuilt acme.sh state
      ansible.builtin.slurp:
        src: "{{ _web_legacy_acme_conf }}"
      register: _web_rebuilt_acme_conf

    - name: Assert the upgrade erased the old layout instead of migrating it
      ansible.builtin.assert:
        that:
          - _web_legacy_rudiments.results | map(attribute='stat.exists') | unique | list == [false]
          - >-
            "Le_RealFullChainPath='/certs/" ~ _web_legacy_domain ~ "/fullchain.pem'"
            in (_web_rebuilt_acme_conf.content | b64decode)
        fail_msg: >-
          The upgrade left pre-multi-domain state behind. acme.sh would keep
          skipping issuance and HAProxy would serve the bootstrap certificate.

    - name: Wait for a reissued Pebble certificate on the upgraded domain
      community.crypto.get_certificate:
        host: 127.0.0.1
        port: 443
        server_name: "{{ _web_legacy_domain }}"
      register: _web_upgraded_certificate
      until:
        - _web_upgraded_certificate.cert is defined
        - "'Pebble' in (_web_upgraded_certificate.issuer.CN | default(''))"
      retries: 30
      delay: 3

    - name: Assert the untouched domain kept its certificate through the upgrade
      community.crypto.get_certificate:
        host: 127.0.0.1
        port: 443
        server_name: "{{ _web_domains | rejectattr('domain', 'equalto', _web_legacy_domain) | map(attribute='domain') | first }}"
      register: _web_untouched_certificate
      failed_when: "'Pebble' not in (_web_untouched_certificate.issuer.CN | default(''))"
