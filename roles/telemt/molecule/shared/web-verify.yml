---
- name: Verify Telemt WEB
  hosts: all
  gather_facts: false
  vars_files:
    - vars/common.yml
  vars:
    _web_carrier: "{{ molecule_telemt_web_carrier }}"
    _web_config_dir: /opt/telemt_web
    _web_instance_name: telemt-web
  tasks:
    - name: Wait for common runtime services
      ansible.builtin.import_tasks: tasks/wait-services.yml
      vars:
        molecule_telemt_listen_port: 443
        molecule_telemt_instance_name: "{{ _web_instance_name }}"

    - name: Wait for HAProxy service
      ansible.builtin.systemd:
        name: "podman-{{ _web_instance_name }}-haproxy.service"
      register: _haproxy_service
      until: _haproxy_service.status.ActiveState == 'active'
      retries: 20
      delay: 3

    - name: Read deployment mode marker
      ansible.builtin.slurp:
        src: "{{ _web_config_dir }}/deployment-mode"
      register: _mode_marker

    - name: Read rendered WEB configs
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ _web_config_dir }}/telemt.toml"
        - "{{ _web_config_dir }}/haproxy.cfg"
        - "{{ _web_config_dir }}/Caddyfile"
      register: _web_configs

    - name: Assert WEB topology is rendered safely
      vars:
        _web_telemt_toml: "{{ _web_configs.results[0].content | b64decode }}"
        _web_haproxy_cfg: "{{ _web_configs.results[1].content | b64decode }}"
        _web_caddyfile: "{{ _web_configs.results[2].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - (_mode_marker.content | b64decode | trim) == 'web'
          - "'transport = \"web\"' in _web_telemt_toml"
          - "'ip = \"127.0.0.1\"' in _web_telemt_toml"
          - "'proxy_protocol = false' in _web_telemt_toml"
          - "'public_addr = \"127.0.0.1:443\"' in _web_telemt_toml"
          - "'carrier = \"' ~ _web_carrier ~ '\"' in _web_telemt_toml"
          - "'send-proxy-v2' in _web_haproxy_cfg"
          - "'accept-proxy ssl alpn h2,http/1.1' in _web_haproxy_cfg"
          - "'server telemt 127.0.0.1:18080' in _web_haproxy_cfg"
          - "'auto_https off' in _web_caddyfile"

    - name: Verify fail-fast WEB preflight cases
      ansible.builtin.include_tasks: tasks/expect-web-preflight-failure.yml
      loop:
        - name: non-standard-public-port
          listen_port: 8443
          error: WEB mode requires port 443
        - name: unsupported-ee-profile
          profiles:
            - user: alice
              secret_mode: ee
          error: Each WEB profile must reference
        - name: ambiguous-decoy-source
          site_dir: /tmp/duplicate-decoy
          error: WEB mode requires exactly one operator-owned decoy source
        - name: unsupported-telemt-release
          image_tag: 3.5.1
          error: Numeric telemt_image_tag values in WEB mode must be
      loop_control:
        loop_var: _web_preflight_case
        label: "{{ _web_preflight_case.name }}"

    - name: Assert rejected preflight cases did not alter WEB runtime
      ansible.builtin.assert:
        that:
          - (_mode_marker.content | b64decode | trim) == 'web'
          - _haproxy_service.status.ActiveState == 'active'

    - name: Wait for Pebble-issued public certificate
      community.crypto.get_certificate:
        host: 127.0.0.1
        port: 443
        server_name: "{{ molecule_telemt_web_domain }}"
      register: _web_certificate
      until:
        - _web_certificate.cert is defined
        - "'Pebble' in (_web_certificate.issuer.CN | default(''))"
      retries: 30
      delay: 3

    - name: Negotiate HTTP/2 ALPN on public endpoint
      ansible.builtin.command:
        argv:
          - openssl
          - s_client
          - -connect
          - 127.0.0.1:443
          - -servername
          - "{{ molecule_telemt_web_domain }}"
          - -alpn
          - h2
      register: _web_alpn
      changed_when: false
      failed_when: >-
        _web_alpn.rc != 0
        or 'ALPN protocol: h2' not in (_web_alpn.stdout ~ _web_alpn.stderr)

    - name: Run mandatory Telegram WEB E2E for plain profile
      ansible.builtin.script:
        cmd: >-
          files/web_flow.py
          --host {{ molecule_telemt_web_domain }}
          --secret {{ molecule_telemt_users.alice }}
          --secret-mode plain
          --carrier {{ _web_carrier }}
          --decoy-marker "The site is under construction."
      register: _web_plain_flow
      changed_when: false
      no_log: true

    - name: Run mandatory Telegram WEB E2E for DD profile
      ansible.builtin.script:
        cmd: >-
          files/web_flow.py
          --host {{ molecule_telemt_web_domain }}
          --secret {{ molecule_telemt_users.bob }}
          --secret-mode dd
          --carrier {{ _web_carrier }}
          --decoy-marker "The site is under construction."
      register: _web_dd_flow
      changed_when: false
      no_log: true

    - name: Read emitted WEB links
      ansible.builtin.slurp:
        src: "{{ _web_config_dir }}/molecule-web-link-debug.json"
      register: _web_links_raw

    - name: Assert WEB links omit port and FakeTLS mode
      vars:
        _web_links: "{{ _web_links_raw.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - _web_links | length == 2
          - "'[alice] tg://webproxy?server=' ~ molecule_telemt_web_domain ~ '&secret=' ~ molecule_telemt_users.alice in _web_links"
          - "'[bob] tg://webproxy?server=' ~ molecule_telemt_web_domain ~ '&secret=dd' ~ molecule_telemt_users.bob in _web_links"
          - "(_web_links | join(' ')).find('&port=') == -1"
          - "(_web_links | join(' ')).find('&secret=ee') == -1"

    - name: Verify colocated direct and WEB deployments
      ansible.builtin.import_tasks: tasks/verify-coexistence.yml
