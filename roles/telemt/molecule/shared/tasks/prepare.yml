---
# gha (mp_driver=native) only — the podman scenarios inject the same
# mapping via molecule.yml `etc_hosts`, and /etc/hosts in the container
# is a bind-mount that lineinfile's atomic-rename can't replace.
- name: Ensure telemt domain resolves to loopback
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 {{ item }}"
    regexp: '^127\.0\.0\.1\s+{{ item | regex_escape }}\s*$'
    state: present
  loop:
    - "{{ molecule_telemt_domain }}"
    - "{{ molecule_telemt_web_domain }}"
  when: mp_driver != 'podman'

# python3-cryptography supplies AES-CTR for the mandatory WEB req_pq/resPQ
# probe. httpx + h2 exercise both carriers over the production HTTP/2 path.
# crun supports the cgroup-free one-shot mtp_ping container in both drivers;
# distro packages keep the Molecule target free of pip state.
- name: Install verify-side dependencies
  ansible.builtin.apt:
    name:
      - curl
      - openssl
      - ca-certificates
      - crun
      - netcat-openbsd
      - python3-cryptography
      - python3-h2
      - python3-httpx
    update_cache: true
    state: present
