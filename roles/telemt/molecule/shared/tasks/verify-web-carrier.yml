---
- name: Deploy WEB carrier {{ _web_carrier_under_test }}
  ansible.builtin.include_tasks: converge-web.yml
  vars:
    molecule_telemt_web_carrier: "{{ _web_carrier_under_test }}"

- name: Apply WEB carrier handlers | {{ _web_carrier_under_test }}
  ansible.builtin.meta: flush_handlers

- name: Wait for WEB carrier runtime | {{ _web_carrier_under_test }}
  ansible.builtin.include_tasks: wait-services.yml
  vars:
    molecule_telemt_listen_port: 443
    molecule_telemt_instance_name: telemt-web

- name: Wait for WEB carrier HAProxy | {{ _web_carrier_under_test }}
  ansible.builtin.systemd:
    name: podman-telemt-web-haproxy.service
  register: _carrier_haproxy_service
  until: _carrier_haproxy_service.status.ActiveState == 'active'
  retries: 20
  delay: 3

- name: Read WEB carrier configuration | {{ _web_carrier_under_test }}
  ansible.builtin.slurp:
    src: /opt/telemt_web/telemt.toml
  register: _carrier_telemt_config

- name: Assert WEB carrier is active | {{ _web_carrier_under_test }}
  ansible.builtin.assert:
    that:
      - >-
        'carrier = "' ~ _web_carrier_under_test ~ '"'
        in (_carrier_telemt_config.content | b64decode)

# Every carrier is exercised on every WEB domain. One domain succeeding says
# nothing about the others: HAProxy picks the certificate and backend per SNI
# and Host, and the client derives its carrier capability from the server
# name, so each vhost is an independent end-to-end path.
- name: Run Telegram E2E on every WEB domain | {{ _web_carrier_under_test }}
  ansible.builtin.include_tasks: verify-web-domain-flows.yml
  loop: >-
    {{
      molecule_telemt_web_domains
      | dict2items(key_name='label', value_name='domain')
      | sort(attribute='label')
    }}
  loop_control:
    loop_var: _web_domain_under_test
    label: "{{ _web_domain_under_test.domain }}"
