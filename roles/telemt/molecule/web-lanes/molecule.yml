---
driver:
  name: podman
platforms:
  - name: molecule-telemt
    image: "docker.io/library/debian:trixie"
    pre_build_image: false
    systemd: always
    network: "${MP_NETWORK:-slirp4netns}"
    security_opts:
      - "label=disable"
      - "unmask=/proc/*"
      - "apparmor=unconfined"
    capabilities:
      - SYS_ADMIN
      - SETUID
      - SETGID
      - NET_ADMIN
    etc_hosts:
      telemt.test: "127.0.0.1"
    devices:
      - /dev/fuse:/dev/fuse
    command: ""
    override_command: false
provisioner:
  inventory:
    host_vars:
      molecule-telemt:
        molecule_telemt_web_carrier: https-lanes
ansible:
  playbooks:
    converge: ../shared/web-converge.yml
    verify: ../shared/web-verify.yml
