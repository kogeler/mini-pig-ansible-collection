- name: telemt | main | preflight
  ansible.builtin.include_tasks:
    file: preflight.yml
    apply:
      tags: ["telemt", "telemt-preflight"]
  when: telemt_enabled
  tags: ["telemt", "telemt-preflight"]

- name: telemt | main | install
  ansible.builtin.include_tasks:
    file: install.yml
    apply:
      tags: ["telemt", "telemt-install"]
  when: telemt_enabled
  tags: ["telemt", "telemt-install"]

- name: telemt | main | image
  ansible.builtin.include_tasks:
    file: image.yml
    apply:
      tags: ["telemt", "telemt-image"]
  when: telemt_enabled
  tags: ["telemt", "telemt-image"]

- name: telemt | main | config
  ansible.builtin.include_tasks:
    file: config.yml
    apply:
      tags: ["telemt", "telemt-config"]
  when: telemt_enabled
  tags: ["telemt", "telemt-config"]

- name: telemt | main | services
  ansible.builtin.include_tasks:
    file: services.yml
    apply:
      tags: ["telemt", "telemt-services"]
  when: telemt_enabled
  tags: ["telemt", "telemt-services"]

- name: telemt | main | acme
  ansible.builtin.include_tasks:
    file: acme.yml
    apply:
      tags: ["telemt", "telemt-acme"]
  when:
    - telemt_enabled
    - telemt_deployment_mode == 'web'
  tags: ["telemt", "telemt-acme"]

- name: telemt | main | healthchecks
  ansible.builtin.include_tasks:
    file: healthchecks.yml
    apply:
      tags: ["telemt", "telemt-healthchecks"]
  when:
    - telemt_enabled
    - not ansible_check_mode
  tags: ["telemt", "telemt-healthchecks"]

- name: telemt | main | links
  ansible.builtin.include_tasks:
    file: links.yml
    apply:
      tags: ["telemt", "telemt-links"]
  when: telemt_enabled
  tags: ["telemt", "telemt-links"]
