- name: telemt | config | create runtime directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ telemt_config_dir }}", mode: "0750"}
    - {path: "{{ _telemt_decoy_data_dir }}", mode: "0755"}
    - {path: "{{ _telemt_decoy_config_dir }}", mode: "0755"}
    - {path: "{{ _telemt_decoy_html_dir }}", mode: "0755"}
  loop_control:
    label: "{{ item.path }}"

- name: telemt | config | create WEB certificate directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    # The official HAProxy image runs as an unprivileged account. Keep the
    # directory traversable and the loaded key readable, matching the proven
    # naive_proxy certificate contract; the parent config dir remains 0750.
    - {path: "{{ _telemt_certs_dir }}", mode: "0755"}
    - {path: "{{ _telemt_acme_data_dir }}", mode: "0750"}
  when: telemt_deployment_mode == 'web'

- name: telemt | config | create per-domain WEB certificate directories
  ansible.builtin.file:
    path: "{{ _telemt_certs_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ _telemt_web_domain_list }}"
  when: telemt_deployment_mode == 'web'

# Deployments predating telemt_web_domains kept one flat certificate pair
# directly under the certs directory. Every domain now has its own directory,
# so the flat pair is dead material; leaving a stale private key behind would
# be the worst of the possible outcomes. The per-domain bootstrap below plus
# the ACME task reissue immediately, so nothing is lost by removing it.
- name: telemt | config | remove pre-multi-domain flat WEB certificate
  ansible.builtin.file:
    path: "{{ _telemt_certs_dir }}/{{ item }}"
    state: absent
  loop: "{{ _telemt_web_flat_cert_files }}"
  when: telemt_deployment_mode == 'web'

- name: telemt | config | copy operator decoy site
  ansible.builtin.copy:
    src: "{{ telemt_decoy_site_dir }}/"
    dest: "{{ _telemt_decoy_html_dir }}/"
    owner: root
    group: root
    mode: preserve
  when: telemt_decoy_site_dir | default('', true) | length > 0
  notify: "{{ _telemt_restart_decoy_handler }}"

- name: telemt | config | copy decoy index
  ansible.builtin.copy:
    src: "{{ telemt_decoy_index_html | default('index.html', true) }}"
    dest: "{{ _telemt_decoy_html_dir }}/index.html"
    owner: root
    group: root
    mode: "0644"
  when:
    - telemt_decoy_site_dir | default('', true) | length == 0
    - telemt_decoy_upstream_url | default('', true) | length == 0
  notify: "{{ _telemt_restart_decoy_handler }}"

- name: telemt | config | render Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ telemt_config_dir }}/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  notify: "{{ _telemt_restart_decoy_handler }}"

- name: telemt | config | render Telemt config
  ansible.builtin.template:
    src: telemt.toml.j2
    dest: "{{ telemt_config_dir }}/telemt.toml"
    owner: root
    group: root
    # The upstream image runs as an unprivileged UID. The parent directory is
    # root-only (0750); the bind-mounted file itself must be readable inside
    # the container, as in the historical direct deployment.
    mode: "0644"
  diff: false
  notify: "{{ _telemt_restart_telemt_handler }}"

- name: telemt | config | check WEB bootstrap certificates
  ansible.builtin.stat:
    path: "{{ _telemt_certs_dir }}/{{ item }}/fullchain.pem"
  register: _telemt_cert_stat
  loop: "{{ _telemt_web_domain_list }}"
  when: telemt_deployment_mode == 'web'

# HAProxy refuses to start without a certificate for every SNI entry, and the
# ACME responder itself is reachable only once HAProxy is up. Each new domain
# therefore needs a self-signed placeholder before acme.sh can replace it.
- name: telemt | config | create WEB bootstrap certificates
  vars:
    _telemt_bootstrap_domains: >-
      {{
        (_telemt_cert_stat.results | default([]))
        | rejectattr('skipped', 'defined')
        | rejectattr('stat.exists')
        | map(attribute='item')
        | list
      }}
  when:
    - telemt_deployment_mode == 'web'
    - _telemt_bootstrap_domains | length > 0
  block:
    - name: telemt | config | generate bootstrap private keys
      community.crypto.openssl_privatekey:
        path: "{{ _telemt_certs_dir }}/{{ item }}/key.pem"
        type: ECC
        curve: secp256r1
        owner: root
        group: root
        mode: "0644"
      loop: "{{ _telemt_bootstrap_domains }}"

    - name: telemt | config | generate bootstrap CSRs
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ _telemt_certs_dir }}/{{ item }}/key.pem"
        common_name: "{{ item }}"
        subject_alt_name:
          - "DNS:{{ item }}"
      register: _telemt_bootstrap_csr
      loop: "{{ _telemt_bootstrap_domains }}"

    - name: telemt | config | generate bootstrap self-signed certificates
      community.crypto.x509_certificate:
        path: "{{ _telemt_certs_dir }}/{{ item.item }}/fullchain.pem"
        privatekey_path: "{{ _telemt_certs_dir }}/{{ item.item }}/key.pem"
        csr_content: "{{ item.csr }}"
        provider: selfsigned
        selfsigned_not_after: "+30d"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ _telemt_bootstrap_csr.results }}"
      loop_control:
        label: "{{ item.item }}"

- name: telemt | config | enforce WEB private-key permissions
  ansible.builtin.file:
    path: "{{ _telemt_certs_dir }}/{{ item }}/key.pem"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _telemt_web_domain_list }}"
  when: telemt_deployment_mode == 'web'

- name: telemt | config | render HAProxy config
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ _telemt_haproxy_config_path }}"
    owner: root
    group: root
    mode: "0644"
  when: telemt_deployment_mode == 'web'
  notify: "{{ _telemt_restart_haproxy_handler }}"

- name: telemt | config | validate HAProxy config
  ansible.builtin.command:
    argv: >-
      {{
        ['podman', 'run', '--rm']
        + _telemt_podman_probe_args
        + [
            '--volume',
            _telemt_haproxy_config_path ~ ':/usr/local/etc/haproxy/haproxy.cfg:ro',
            '--volume',
            _telemt_certs_dir ~ ':/certs:ro',
            telemt_haproxy_image ~ ':' ~ telemt_haproxy_image_tag,
            'haproxy', '-c', '-f', '/usr/local/etc/haproxy/haproxy.cfg'
          ]
      }}
  changed_when: false
  when:
    - telemt_deployment_mode == 'web'
    - not ansible_check_mode

- name: telemt | config | render pod systemd unit
  ansible.builtin.template:
    src: pod.service.j2
    dest: "/etc/systemd/system/{{ _telemt_pod_systemd_unit_name }}"
    owner: root
    group: root
    mode: "0600"
  notify: "{{ _telemt_restart_pod_handler }}"

- name: telemt | config | render decoy systemd unit
  ansible.builtin.template:
    src: decoy.service.j2
    dest: "/etc/systemd/system/{{ _telemt_decoy_systemd_unit_name }}"
    owner: root
    group: root
    mode: "0600"
  notify: "{{ _telemt_restart_decoy_handler }}"

- name: telemt | config | render Telemt systemd unit
  ansible.builtin.template:
    src: .service.j2
    dest: "/etc/systemd/system/{{ _telemt_systemd_unit_name }}"
    owner: root
    group: root
    mode: "0600"
  notify: "{{ _telemt_restart_telemt_handler }}"

- name: telemt | config | render HAProxy systemd unit
  ansible.builtin.template:
    src: haproxy.service.j2
    dest: "/etc/systemd/system/{{ _telemt_haproxy_systemd_unit_name }}"
    owner: root
    group: root
    mode: "0600"
  when: telemt_deployment_mode == 'web'
  notify: "{{ _telemt_restart_haproxy_handler }}"

- name: telemt | config | render ACME systemd units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {src: acme-renew.service.j2, dest: "{{ _telemt_acme_renew_unit_name }}", mode: "0600"}
    - {src: acme-renew.timer.j2, dest: "{{ _telemt_acme_renew_timer_name }}", mode: "0644"}
  when: telemt_deployment_mode == 'web'

- name: telemt | config | render Pebble config
  ansible.builtin.template:
    src: pebble-config.json.j2
    dest: "{{ telemt_config_dir }}/pebble-config.json"
    owner: root
    group: root
    mode: "0644"
  when: telemt_molecule_mode
  notify: "{{ _telemt_restart_pebble_handler }}"

- name: telemt | config | render Pebble systemd unit
  ansible.builtin.template:
    src: pebble.service.j2
    dest: "/etc/systemd/system/{{ _telemt_pebble_systemd_unit_name }}"
    owner: root
    group: root
    mode: "0600"
  when: telemt_molecule_mode
  notify: "{{ _telemt_restart_pebble_handler }}"
